<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hola JS</title>
</head>
<body>
  <script>
    console.log("¡Hola, mundo!");
    let nombre = "Pablo";
    console.log("Bienvenido, " + nombre);

    let suma = 5 + 3;
    console.log("La suma de 5 + 3 es: " + suma)
    
    let apellido = "Jurado";
    console.log("Bienvenido, " + nombre + " " + apellido);

    let apellidomayusculas = apellido.toUpperCase();

    document.body.innerHTML = "<h1>¡Hola, " + nombre + " " + apellidomayusculas + "!</h1>";
  </script>
</body>
</html>
